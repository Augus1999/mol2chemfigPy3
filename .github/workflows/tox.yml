name: CI_tox

on:
  workflow_dispatch:  # the manual trigger


jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install tox, project, and project dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions
        pip install .[dev]

    - name: run tox' jobs (which GitHub happens to split in separate jobs)
      run: tox

  connectivity:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      max-parallel: 1  # sequential runs as an additional throttle on requests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.x"
      - run: |
         python -m pip install --upgrade pip
         pip install tox tox-gh-actions
         pip install .[dev]
      - run: tox -e connectivity
